[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-agent"
version = "0.1.1"
description = "LangGraph AutoML agent: plan -> select -> train -> evaluate -> critique -> replan"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.60",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
# AUTOML_USE_BEDROCK=1 only: the SDK signs those requests with SigV4 via botocore.
# The direct ANTHROPIC_API_KEY route needs none of this.
bedrock = ["anthropic[bedrock]>=0.60"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["automl_agent*"]

[tool.setuptools.package-data]
automl_agent = ["llm/prompts/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
    "B008",    # partial-bound node signatures
    "RET504",  # a named result before return reads better here
]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12 `type` statements, which a
# pinned 3.11 check rejects before it ever reaches our code.
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["automl_agent"]
